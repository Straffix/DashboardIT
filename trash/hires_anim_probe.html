<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hires Animation Probe</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #111827;
            color: #e5e7eb;
        }

        iframe {
            width: 1440px;
            height: 1400px;
            border: 0;
            background: #fff;
        }

        pre {
            margin: 0;
            padding: 16px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <iframe id="app" src="../nowe_zatrudnienia.html"></iframe>
    <pre id="results">Running probe...</pre>

    <script>
        const STORAGE_KEY = 'nowe_zatrudnienia_dane'
        const hiresData = [
            {
                name: 'JAN TESTOWY',
                ru: 'IT',
                sn: 'SN000001',
                date: '2026-03-10',
                accessories: ['mouse'],
            },
            {
                name: 'ANNA TEST 1',
                ru: 'HR',
                sn: 'SN100001',
                date: '2026-04-01',
                accessories: ['mouse', 'keyboard'],
            },
            {
                name: 'ANNA TEST 2',
                ru: 'HR',
                sn: 'SN100002',
                date: '2026-04-02',
                accessories: ['mouse', 'keyboard'],
            },
            {
                name: 'ANNA TEST 3',
                ru: 'HR',
                sn: 'SN100003',
                date: '2026-04-03',
                accessories: ['mouse', 'keyboard'],
            },
            {
                name: 'ANNA TEST 4',
                ru: 'HR',
                sn: 'SN100004',
                date: '2026-04-04',
                accessories: ['mouse', 'keyboard'],
            },
            {
                name: 'ANNA TEST 5',
                ru: 'HR',
                sn: 'SN100005',
                date: '2026-04-05',
                accessories: ['mouse', 'keyboard'],
            },
        ]

        localStorage.setItem(STORAGE_KEY, JSON.stringify(hiresData))

        const frame = document.getElementById('app')
        const results = document.getElementById('results')
        const samples = []

        function round(value) {
            return Math.round(value * 100) / 100
        }

        function capture(label) {
            const win = frame.contentWindow
            const doc = frame.contentDocument
            const workspace = doc.querySelector('.hires-workspace')
            const wrapper = doc.querySelector('.wrapper')
            const tbody = doc.getElementById('table-body')

            samples.push({
                t: round(win.performance.now()),
                label,
                workspaceHeight: round(workspace.getBoundingClientRect().height),
                workspaceScrollHeight: round(workspace.scrollHeight),
                workspaceTop: round(workspace.getBoundingClientRect().top),
                wrapperLeft: round(wrapper.getBoundingClientRect().left),
                wrapperWidth: round(wrapper.getBoundingClientRect().width),
                bodyScrollHeight: round(doc.body.scrollHeight),
                htmlClientWidth: round(doc.documentElement.clientWidth),
                bodyClass: doc.body.className,
                tbodyClass: tbody.className,
                month: doc.getElementById('current-month-display').textContent.trim(),
            })
        }

        function sampleFor(durationMs, labelPrefix) {
            return new Promise(resolve => {
                const start = performance.now()

                function tick() {
                    capture(labelPrefix)
                    if (performance.now() - start >= durationMs) {
                        resolve()
                        return
                    }

                    requestAnimationFrame(tick)
                }

                tick()
            })
        }

        async function clickAndSample(delta, label) {
            const doc = frame.contentDocument
            const button = doc.querySelector(`[data-month-delta="${delta}"]`)
            capture(`${label}-before`)
            button.click()
            await sampleFor(900, label)
            capture(`${label}-after`)
        }

        function summarize() {
            const byLabel = name => samples.filter(sample => sample.label.startsWith(name))

            function summarizeLabel(name) {
                const list = byLabel(name)
                const heights = list.map(item => item.workspaceHeight)
                const widths = list.map(item => item.wrapperWidth)
                const lefts = list.map(item => item.wrapperLeft)

                return {
                    name,
                    firstHeight: heights[0],
                    maxHeight: Math.max(...heights),
                    minHeight: Math.min(...heights),
                    lastHeight: heights[heights.length - 1],
                    firstWidth: widths[0],
                    lastWidth: widths[widths.length - 1],
                    firstLeft: lefts[0],
                    lastLeft: lefts[lefts.length - 1],
                }
            }

            return {
                grow: summarizeLabel('grow'),
                shrink: summarizeLabel('shrink'),
                tail: samples.slice(-18),
            }
        }

        frame.addEventListener('load', async () => {
            const doc = frame.contentDocument
            const monthDisplay = doc.getElementById('current-month-display')

            const waitForReady = () =>
                new Promise(resolve => {
                    const start = performance.now()

                    function check() {
                        if (monthDisplay && monthDisplay.textContent.trim() && doc.getElementById('table-body').children.length) {
                            resolve()
                            return
                        }

                        if (performance.now() - start > 3000) {
                            resolve()
                            return
                        }

                        requestAnimationFrame(check)
                    }

                    check()
                })

            await waitForReady()
            await new Promise(resolve => setTimeout(resolve, 300))

            capture('initial')
            await clickAndSample(1, 'grow')
            await new Promise(resolve => setTimeout(resolve, 400))
            await clickAndSample(-1, 'shrink')
            await new Promise(resolve => setTimeout(resolve, 400))

            results.textContent = JSON.stringify(summarize(), null, 2)
        }, { once: true })
    </script>
</body>
</html>
