<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hires animation check</title>
    <link rel="stylesheet" href="./styles/css/style.css">
    <link rel="stylesheet" href="./styles/css/zatrudnienia.css">
    <style>
        body {
            margin: 0;
            padding: 32px;
            background: #f4f6fb;
        }

        .test-shell {
            max-width: 1800px;
            margin: 0 auto;
        }

        #output {
            margin: 0 0 20px;
            padding: 16px 18px;
            border-radius: 18px;
            background: #111827;
            color: #e5e7eb;
            font: 14px/1.45 Consolas, "Courier New", monospace;
            white-space: pre-wrap;
        }

        .test-card {
            padding: 28px;
            background: #ffffff;
            border: 1px solid rgba(28, 47, 87, 0.08);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(21, 41, 80, 0.08);
        }

        .test-card table {
            width: 100%;
        }

        .test-title {
            margin: 0 0 18px;
            color: #253041;
            font: 700 24px/1.15 "Segoe UI", sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .app-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1em;
            min-height: 1em;
            font-style: normal;
        }

        .test-height-anchor {
            grid-column: 1 / -1;
            min-height: 112px;
        }
    </style>
</head>
<body class="hires-page">
    <div class="test-shell">
        <pre id="output">running</pre>

        <div class="test-card">
            <h1 class="test-title">LIPIEC 2026</h1>

            <table class="hires-table">
                <thead>
                    <tr>
                        <th>SERVICE DESK</th>
                        <th>UZYTKOWNIK</th>
                        <th>START</th>
                        <th>LAPTOP SN</th>
                        <th>LAPTOP RU</th>
                        <th>LAPTOP STATUS</th>
                        <th>LAPTOP EMAG</th>
                        <th>MONITOR RU</th>
                        <th>MONITOR STATUS</th>
                        <th>MONITOR EMAG</th>
                        <th>AKCJE</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const VISIBLE_TABLE_COLUMN_COUNT = 11
        const CLOSE_CAPTURE_MS = 900
        const OPEN_WAIT_MS = 500
        const output = document.getElementById('output')
        const tableBody = document.getElementById('table-body')
        const rowKey = 'hire-row-1'

        function renderRows() {
            tableBody.innerHTML = `
                <tr class="hire-row-main" data-row-key="${rowKey}">
                    <td class="is-sticky-left-1"><span class="hire-chip hire-chip-primary">3832985923</span></td>
                    <td class="is-sticky-left-2"><span class="hire-name">Norbert Walczak - Pietrzak - Dabrowski</span></td>
                    <td><span class="status-pill status-pill-positive">2026-07-15</span></td>
                    <td><span class="hire-chip">PW920192</span></td>
                    <td><span class="hire-chip">90807021</span></td>
                    <td><span class="hire-chip-muted hire-tone-warn">W trakcie</span></td>
                    <td><span class="hire-tone-danger">Brak konta</span></td>
                    <td><span class="hire-chip">54621512</span></td>
                    <td><span class="hire-chip-muted hire-tone-warn">W trakcie / czekamy na dostawe</span></td>
                    <td><span class="hire-tone-danger">Brak konta</span></td>
                    <td class="cell-center is-sticky-right">
                        <div class="hire-actions">
                            <button
                                class="icon-button hire-action-btn hire-action-btn-toggle has-accessories"
                                type="button"
                                data-action="toggle-accessories"
                                aria-expanded="false"
                                aria-label="Pokaz szczegoly"
                                title="Pokaz szczegoly"
                            >
                                <i class="app-icon">L</i>
                            </button>
                            <button class="icon-button hire-action-btn" type="button" aria-label="Edytuj wpis"><i class="app-icon">E</i></button>
                            <button class="icon-button hire-action-btn hire-action-btn-danger" type="button" aria-label="Usun wpis"><i class="app-icon">U</i></button>
                        </div>
                    </td>
                </tr>
                <tr class="hire-accessories-row is-collapsed-hidden" data-row-key="${rowKey}" aria-hidden="true">
                    <td colspan="${VISIBLE_TABLE_COLUMN_COUNT}" class="hire-accessories-cell">
                        <div class="hire-accessories-collapse">
                            <div class="hire-accessories-collapse-inner">
                                <div class="hire-accessories-panel">
                                    <div class="hire-accessories-meta">
                                        <div class="hire-accessories-meta-item">
                                            <span class="hire-accessories-meta-label">PRZYGOTOWAL/A</span>
                                            <span class="hire-accessories-meta-value">Jakub Gauze</span>
                                        </div>
                                        <div class="hire-accessories-meta-item">
                                            <span class="hire-accessories-meta-label">HISTORIA WPISU</span>
                                            <div class="record-audit">
                                                <span class="record-audit-line"><strong>Dodal:</strong> Arkadiusz Lisiecki · 2026-06-25</span>
                                                <span class="record-audit-line"><strong>Edytowal:</strong> Arkadiusz Lisiecki · 2026-07-06</span>
                                            </div>
                                        </div>
                                        <div class="hire-accessories-meta-item is-scrollable is-wide">
                                            <span class="hire-accessories-meta-label">UWAGI</span>
                                            <span class="hire-accessories-meta-value">Zerknac, czy nie ma poprzedniego laptopa. Ten blok ma realistyczna wysokosc, zeby test zwijania byl zblizony do widoku produkcyjnego.</span>
                                        </div>
                                        <div class="hire-accessories-meta-item">
                                            <span class="hire-accessories-meta-label">LOKALIZACJA</span>
                                            <span class="hire-accessories-meta-value">Centrala</span>
                                        </div>
                                    </div>

                                    <div class="hire-accessories-group">
                                        <span class="hire-accessories-meta-label">AKCESORIA</span>
                                        <div class="hire-accessories-icons">
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">M</i><small>Monitor</small></button>
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">M</i><small>Mysz</small></button>
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">K</i><small>Klawiatura</small></button>
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">Y</i><small>Yealink</small></button>
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">L</i><small>Logi Zone</small></button>
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">B</i><small>Bag</small></button>
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">P</i><small>Plecak</small></button>
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">S</i><small>Stand</small></button>
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">R</i><small>Prezenter</small></button>
                                            <button class="hire-accessory-preview-icon" type="button"><i class="app-icon">D</i><small>Drukarka</small></button>
                                        </div>
                                    </div>

                                    <div class="test-height-anchor" aria-hidden="true"></div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr class="hire-row-main" data-row-key="hire-row-2">
                    <td class="is-sticky-left-1"><span class="hire-chip hire-chip-primary">sfs</span></td>
                    <td class="is-sticky-left-2"><span class="hire-name">Tester Testowy</span></td>
                    <td><span class="status-pill status-pill-neutral">2026-07-06</span></td>
                    <td><span class="hire-chip">test</span></td>
                    <td><span class="hire-chip">test</span></td>
                    <td><span class="hire-tone-danger">Gotowy do wydania</span></td>
                    <td><span class="hire-tone-danger">Brak konta</span></td>
                    <td><span class="hire-chip">39325872</span></td>
                    <td><span class="hire-chip-muted hire-tone-warn">W trakcie / czekamy na dostawe</span></td>
                    <td><span class="hire-tone-danger">Brak konta</span></td>
                    <td class="cell-center is-sticky-right">
                        <div class="hire-actions">
                            <button class="icon-button hire-action-btn hire-action-btn-toggle has-accessories" type="button" aria-label="Pokaz szczegoly"><i class="app-icon">L</i></button>
                            <button class="icon-button hire-action-btn" type="button" aria-label="Edytuj wpis"><i class="app-icon">E</i></button>
                            <button class="icon-button hire-action-btn hire-action-btn-danger" type="button" aria-label="Usun wpis"><i class="app-icon">U</i></button>
                        </div>
                    </td>
                </tr>
            `
        }

        function getAccessoriesRowDomBundle(targetRowKey) {
            const mainRow = Array.from(tableBody.querySelectorAll('.hire-row-main')).find(row => row.dataset.rowKey === targetRowKey)
            if (!mainRow) return null

            return {
                mainRow,
                detailRow: Array.from(tableBody.querySelectorAll('.hire-accessories-row')).find(row => row.dataset.rowKey === targetRowKey) || null,
                toggleButton: mainRow.querySelector('[data-action="toggle-accessories"]'),
            }
        }

        function clearAccessoriesCollapseTransitionHandler(collapsePanel) {
            const activeHandler = collapsePanel?._hireAccessoriesTransitionHandler
            if (!collapsePanel || typeof activeHandler !== 'function') return

            collapsePanel.removeEventListener('transitionend', activeHandler)
            delete collapsePanel._hireAccessoriesTransitionHandler
        }

        function onAccessoriesCollapseHeightTransitionEnd(collapsePanel, callback) {
            if (!collapsePanel) return
            clearAccessoriesCollapseTransitionHandler(collapsePanel)

            const nextHandler = event => {
                if (event.target !== collapsePanel || event.propertyName !== 'height') return
                clearAccessoriesCollapseTransitionHandler(collapsePanel)
                callback()
            }

            collapsePanel._hireAccessoriesTransitionHandler = nextHandler
            collapsePanel.addEventListener('transitionend', nextHandler)
        }

        function setAccessoriesCollapseWillChange(collapsePanel, isAnimating) {
            if (!collapsePanel) return
            collapsePanel.style.willChange = isAnimating ? 'height' : ''
        }

        function syncAccessoriesToggleButtonState(toggleButton, isExpanded) {
            if (!toggleButton) return
            toggleButton.setAttribute('aria-expanded', isExpanded ? 'true' : 'false')
            toggleButton.classList.toggle('is-active', isExpanded)
            toggleButton.title = isExpanded ? 'Ukryj szczegoly' : 'Pokaz szczegoly'
            toggleButton.setAttribute('aria-label', isExpanded ? 'Ukryj szczegoly' : 'Pokaz szczegoly')
        }

        function syncAccessoriesRowDomState(targetRowKey, isExpanded) {
            const rowDomBundle = getAccessoriesRowDomBundle(targetRowKey)
            if (!rowDomBundle) return false

            syncAccessoriesToggleButtonState(rowDomBundle.toggleButton, isExpanded)

            if (isExpanded) {
                rowDomBundle.mainRow.classList.add('is-accessories-open')
            }

            const detailRow = rowDomBundle.detailRow
            const collapsePanel = detailRow?.querySelector('.hire-accessories-collapse')

            if (detailRow) {
                if (isExpanded) {
                    detailRow.classList.remove('is-collapsed-hidden')
                    detailRow.setAttribute('aria-hidden', 'false')

                    if (collapsePanel) {
                        clearAccessoriesCollapseTransitionHandler(collapsePanel)
                        setAccessoriesCollapseWillChange(collapsePanel, true)
                        collapsePanel.style.height = '0px'
                    }

                    window.setTimeout(() => {
                        if (detailRow.getAttribute('aria-hidden') === 'false' && collapsePanel) {
                            detailRow.classList.add('is-open')
                            const targetHeight = collapsePanel.scrollHeight
                            onAccessoriesCollapseHeightTransitionEnd(collapsePanel, () => {
                                if (detailRow.classList.contains('is-open')) {
                                    collapsePanel.style.height = 'auto'
                                }
                                setAccessoriesCollapseWillChange(collapsePanel, false)
                            })
                            collapsePanel.style.height = `${targetHeight}px`
                        } else if (detailRow.getAttribute('aria-hidden') === 'false') {
                            detailRow.classList.add('is-open')
                        }
                    }, 16)
                } else {
                    if (collapsePanel) {
                        clearAccessoriesCollapseTransitionHandler(collapsePanel)
                        setAccessoriesCollapseWillChange(collapsePanel, true)
                        const currentHeight = collapsePanel.scrollHeight || collapsePanel.getBoundingClientRect().height
                        collapsePanel.style.height = `${currentHeight}px`
                        void collapsePanel.offsetHeight
                    }

                    detailRow.classList.remove('is-open')
                    detailRow.setAttribute('aria-hidden', 'true')

                    if (collapsePanel) {
                        onAccessoriesCollapseHeightTransitionEnd(collapsePanel, () => {
                            if (detailRow.getAttribute('aria-hidden') === 'true' && !detailRow.classList.contains('is-open')) {
                                detailRow.classList.add('is-collapsed-hidden')
                                collapsePanel.style.height = ''
                                rowDomBundle.mainRow.classList.remove('is-accessories-open')
                            }
                            setAccessoriesCollapseWillChange(collapsePanel, false)
                        })
                        collapsePanel.style.height = '0px'
                    } else {
                        window.setTimeout(() => {
                            if (detailRow.getAttribute('aria-hidden') === 'true' && !detailRow.classList.contains('is-open')) {
                                detailRow.classList.add('is-collapsed-hidden')
                                rowDomBundle.mainRow.classList.remove('is-accessories-open')
                            }
                        }, 0)
                    }
                }
            }

            if (detailRow && !isExpanded && !collapsePanel) {
                window.setTimeout(() => {
                    if (detailRow.getAttribute('aria-hidden') === 'true' && !detailRow.classList.contains('is-open')) {
                        detailRow.classList.add('is-collapsed-hidden')
                        rowDomBundle.mainRow.classList.remove('is-accessories-open')
                    }
                }, 0)
            }

            return true
        }

        function wait(ms) {
            return new Promise(resolve => window.setTimeout(resolve, ms))
        }

        function captureCloseSamples(collapsePanel, detailRow) {
            return new Promise(resolve => {
                const start = performance.now()
                const samples = []

                const snapshot = now => {
                    const computedHeight = Number.parseFloat(window.getComputedStyle(collapsePanel).height) || 0
                    samples.push({
                        t: Math.round(now - start),
                        computedHeight: Number(computedHeight.toFixed(3)),
                        collapseHeight: Number(collapsePanel.getBoundingClientRect().height.toFixed(3)),
                        rowHeight: Number(detailRow.getBoundingClientRect().height.toFixed(3)),
                        isOpen: detailRow.classList.contains('is-open'),
                        isHidden: detailRow.classList.contains('is-collapsed-hidden'),
                    })
                }

                const tick = () => {
                    const now = performance.now()
                    snapshot(now)

                    const elapsed = now - start
                    const last = samples[samples.length - 1]
                    const shouldStop = elapsed >= CLOSE_CAPTURE_MS && last.computedHeight <= 0.5 && last.isHidden

                    if (shouldStop || elapsed >= CLOSE_CAPTURE_MS + 250) {
                        resolve(samples)
                        return
                    }

                    window.setTimeout(tick, 16)
                }

                snapshot(start)
                window.setTimeout(tick, 16)
            })
        }

        function analyzeSamples(samples) {
            let monotonicViolations = 0
            let largestDrop = 0
            let largestLateDrop = 0
            let finalSnap = 0
            let longestLatePlateauMs = 0
            let currentLatePlateauMs = 0

            for (let index = 1; index < samples.length; index += 1) {
                const previous = samples[index - 1]
                const current = samples[index]
                const delta = previous.computedHeight - current.computedHeight

                if (current.computedHeight > previous.computedHeight + 0.5) {
                    monotonicViolations += 1
                }

                if (delta > largestDrop) {
                    largestDrop = delta
                }

                if (previous.computedHeight <= 48 && delta > largestLateDrop) {
                    largestLateDrop = delta
                }

                const isLateRange = previous.computedHeight <= 48
                const isPlateauStep = isLateRange && Math.abs(delta) < 0.45 && previous.computedHeight > 0.5

                if (isPlateauStep) {
                    currentLatePlateauMs += current.t - previous.t
                    if (currentLatePlateauMs > longestLatePlateauMs) {
                        longestLatePlateauMs = currentLatePlateauMs
                    }
                } else {
                    currentLatePlateauMs = 0
                }
            }

            const lastNonZeroIndex = [...samples].map(sample => sample.computedHeight > 0.5).lastIndexOf(true)
            const lastNonZeroSample = lastNonZeroIndex >= 0 ? samples[lastNonZeroIndex] : null

            if (lastNonZeroSample && lastNonZeroIndex < samples.length - 1) {
                finalSnap = lastNonZeroSample.computedHeight - samples[lastNonZeroIndex + 1].computedHeight
            }

            return {
                monotonicViolations,
                largestDrop: Number(largestDrop.toFixed(3)),
                largestLateDrop: Number(largestLateDrop.toFixed(3)),
                finalSnap: Number(finalSnap.toFixed(3)),
                longestLatePlateauMs,
                hiddenAtEnd: samples[samples.length - 1]?.isHidden ?? false,
                finalHeight: Number((samples[samples.length - 1]?.computedHeight ?? 0).toFixed(3)),
                lastNonZeroSample,
                passed:
                    monotonicViolations === 0 &&
                    largestLateDrop <= 6 &&
                    finalSnap <= 6 &&
                    longestLatePlateauMs <= 34 &&
                    (samples[samples.length - 1]?.isHidden ?? false),
            }
        }

        function finish(payload) {
            output.textContent = JSON.stringify(payload, null, 2)
            output.dataset.ok = payload && payload.ok ? 'true' : 'false'
            document.documentElement.dataset.testComplete = 'true'
        }

        async function run() {
            renderRows()
            await wait(80)

            syncAccessoriesRowDomState(rowKey, true)
            await wait(OPEN_WAIT_MS)

            const rowDomBundle = getAccessoriesRowDomBundle(rowKey)
            const collapsePanel = rowDomBundle?.detailRow?.querySelector('.hire-accessories-collapse')
            if (!rowDomBundle || !collapsePanel) {
                throw new Error('missing-collapse-panel')
            }

            const samplesPromise = captureCloseSamples(collapsePanel, rowDomBundle.detailRow)
            syncAccessoriesRowDomState(rowKey, false)
            const samples = await samplesPromise
            const analysis = analyzeSamples(samples)

            finish({
                ok: analysis.passed,
                sampleCount: samples.length,
                openHeightBeforeClose: Number((samples[0]?.computedHeight ?? 0).toFixed(3)),
                scrollHeightBeforeClose: collapsePanel.scrollHeight,
                analysis,
                samples,
            })
        }

        run().catch(error => {
            finish({
                ok: false,
                error: error instanceof Error ? error.message : String(error),
            })
        })
    </script>
</body>
</html>
