<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor laptopów w domenie</title>

    <link rel="stylesheet" href="./styles/css/style.css">
    <link rel="stylesheet" href="./styles/css/monitor.css">
</head>

<body>
    <div class="wrapper">

        <header class="header">
            <div class="logo-section">
                <div class="icon-box">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>

                <div>
                    <h1>Urządzenia w domenie</h1>
                    <p>Lista nie odbija komputera automatycznie. To tylko <span>informacja dla nas!</span></p>
                </div>
            </div>

            <nav class="module-nav" aria-label="Nawigacja modułów">
                <a href="index.html" class="module-nav-link" title="Menu główne" aria-label="Menu główne">
                    <i class="fa-solid fa-house"></i>
                </a>

                <span class="module-nav-divider" aria-hidden="true"></span>

                <a href="nowe_zatrudnienia.html" class="module-nav-link" title="Nowe zatrudnienia"
                    aria-label="Nowe zatrudnienia">
                    <i class="fa-solid fa-user-plus"></i>
                </a>

                <a href="monitor_laptopow.html" class="module-nav-link is-active" aria-current="page"
                    title="Urządzenia w domenie" aria-label="Urządzenia w domenie">
                    <i class="fa-solid fa-laptop"></i>
                </a>
            </nav>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div>
                    <p>WSZYSTKIE</p>
                    <h2 id="stats-all">0</h2>
                </div>
                <i class="fa-solid fa-desktop"></i>
            </div>

            <div class="stat-card active">
                <div>
                    <p>AKTYWNE</p>
                    <h2 id="stats-active">0</h2>
                </div>
                <i class="fa-solid fa-check"></i>
            </div>

            <div class="stat-card warning">
                <div>
                    <p>WYGASAJĄCE</p>
                    <h2 id="stats-warn">0</h2>
                </div>
                <i class="fa-solid fa-clock"></i>
            </div>

            <div class="stat-card danger">
                <div>
                    <p>WYPADŁY</p>
                    <h2 id="stats-danger">0</h2>
                </div>
                <i class="fa-solid fa-circle-xmark"></i>
            </div>
        </div>

        <div class="main-content">
            <section>
                <h2>Lista urządzeń</h2>
                <table class="monitor-table">
                    <thead>
                        <tr>
                            <th>NAZWA</th>
                            <th>RU</th>
                            <th>SN</th>
                            <th>W DOMENIE DO</th>
                            <th class="table-head-cell-center">AKCJA</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </section>

            <aside>
                <h2>Dodaj urządzenie</h2>

                <form id="device-form">

                    <div class="input-group">
                        <label>Nazwa komputera</label>
                        <input type="text" id="name" required placeholder="np. REKRUTACJA746">
                    </div>

                    <div class="input-group">
                        <label>Numer RU</label>
                        <input type="text" id="ru" required placeholder="Tylko cyfry">
                    </div>

                    <div class="input-group">
                        <label>SN</label>
                        <input type="text" id="sn" required placeholder="np. PF928402">
                    </div>

                    <div class="input-group">

                        <label>Typ dodawanego urządzenia</label>

                        <div class="radio-group">

                            <label class="radio-item">
                                <input type="radio" name="device-type" id="new-device" value="new" checked>
                                <span>Nowe</span>
                            </label>

                            <label class="radio-item">
                                <input type="radio" name="device-type" id="old-device" value="old">
                                <span>Stare</span>
                            </label>
                        </div>

                    </div>

                    <div class="input-group" id="date-group">
                        <label>W domenie do</label>
                        <input type="date" id="date">
                    </div>

                    <button type="submit" class="btn-submit">
                        Dodaj urządzenie
                    </button>

                </form>
                <section class="backup_section">

                    <h3>Kopia zapasowa</h3>

                    <div class="backup-container">

                        <div class="backup-row">

                            <button id="export-excel-btn" class="btn-backup-item btn-excel-green" type="button">
                                <i class="fa-solid fa-file-csv"></i> Eksport CSV
                            </button>

                            <input type="file" id="importExcelFile" class="visually-hidden-file-input" accept=".csv">

                            <button id="import-excel-trigger" class="btn-backup-item" type="button">
                                Import CSV
                            </button>

                        </div>
                    </div>
                </section>

            </aside>
        </div>

        <footer class="main-footer">
            <div class="footer-content">
                <p>&copy; <span id="current-year"></span> IT Support Dashboard by Arkadiusz Lisiecki</p>
                <div class="footer-separator"></div>
                <p class="footer-status">
                    <span class="status-dot"></span>
                    arkadiusz-lisiecki.pl
                </p>
            </div>
        </footer>
    </div>

    <script src="./js/script.js"></script>
    <script src="./js/monitor.js"></script>

</body>

</html>
