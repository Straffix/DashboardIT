<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IT</title>

    <link rel="stylesheet" href="./styles/css/style.css">
    <link rel="stylesheet" href="./styles/css/dashboard.css">
</head>

<body class="dashboard-page">
    <div class="wrapper">
        <div class="dashboard-container">
            <header class="dashboard-header">
                <p class="dashboard-kicker">Sekcja wsparcia użytkowników</p>
                <h1>Dashboard IT</h1>
            </header>



            <nav class="menu-grid" aria-label="Moduły dashboardu">

                <!-- ...:: Początek kafelka na stronie głównej ::.. -->
                <a href="nowe_zatrudnienia.html" class="menu-item nowe-zatrudnienia">
                    <article class="dashboard-card">
                        <div class="card-icon-shell">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>
                        <div class="card-copy">
                            <span>Nowe Zatrudnienia</span>
                            <small>Przygotowanie sprzętu dla nowych pracowników.</small>
                        </div>
                    </article>
                </a>
                <!-- ...:: Koniec kafelka na stronie głównej ::.. -->

                <!-- ...:: Początek kafelka na stronie głównej ::.. -->
                <a href="monitor_laptopow.html" class="menu-item monitor-laptopow">
                    <article class="dashboard-card">
                        <div class="card-icon-shell">
                            <i class="fa-solid fa-laptop"></i>
                        </div>
                        <div class="card-copy">
                            <span>Urządzenia w domenie</span>
                            <small>Status urządzeń w domenie.</small>
                        </div>
                    </article>
                </a>

                <!-- ...:: Koniec kafelka na stronie głównej ::.. -->
            </nav>


            <section class="bookmarks" aria-labelledby="bookmarks-title">
                <h2 class="bookmarks-title" id="bookmarks-title">Zakładki</h2>

                <div class="bookmarks-bar">
                    <ul class="bookmarks-list" id="bookmarks-list"></ul>

                    <button type="button" class="bookmark-add-btn" id="bookmark-add-btn" aria-label="Dodaj zakładkę"
                        title="Dodaj zakładkę">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </section>



            <footer class="main-footer">
                <p>&copy; <span id="current-year"></span> IT Support Dashboard by <strong>Arkadiusz Lisiecki</strong>
                </p>
            </footer>

        </div>

    </div>

    <dialog class="modal" id="bookmark-dialog" aria-labelledby="bookmark-dialog-title">
        <form class="modal-form" id="bookmark-form">
            <h2 class="modal-title" id="bookmark-dialog-title">Nowa zakładka</h2>

            <div class="input-group">
                <label for="bookmark-name">Nazwa</label>
                <input type="text" id="bookmark-name" required maxlength="40" placeholder="np. Instrukcja VPN">
            </div>

            <div class="input-group">
                <label for="bookmark-url">Adres</label>
                <input type="text" id="bookmark-url" required inputmode="url" autocomplete="url"
                    placeholder="np. firma.sharepoint.com/...">

            </div>

            <div class="modal-actions">
                <button type="button" class="modal-btn" id="bookmark-cancel-btn">Anuluj</button>
                <button type="submit" class="modal-btn is-primary">Dodaj</button>
            </div>
        </form>
    </dialog>


    <script src="./js/script.js"></script>
    <script src="./js/bookmarks.js"></script>

</body>

</html>
